<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141433">
<title>विश्वरूप स्टूडियो</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ratri:#141433; --panel:#0e0e26; --panel2:#191940; --raised:#212150;
  --gold:#D4AF37; --gold-soft:#E9CC70; --gold-dim:#8a7328;
  --kumkum:#B3261E; --sand:#D8C3A5; --mute:#8b8199; --line:#2a2a5c;
  --ok:#4E9A6A;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--ratri); color:var(--sand);
  font-family:Inter,system-ui,sans-serif; font-size:15px; line-height:1.5;
  overflow:hidden;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--raised);border-radius:6px}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100%}
header{
  display:flex;align-items:center;gap:14px;padding:12px 18px;
  border-bottom:1px solid var(--line);background:var(--panel);flex-shrink:0;
}
.brand{font-family:'Rozha One',serif;font-size:23px;color:var(--gold);letter-spacing:.3px;white-space:nowrap}
.brand span{color:var(--sand);opacity:.85}
.yatra-pick{
  background:var(--panel2);border:1px solid var(--line);border-radius:999px;
  padding:8px 16px;color:var(--sand);font-weight:500;max-width:38vw;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:44px
}
.yatra-pick:hover{border-color:var(--gold)}
.spacer{flex:1}
.hbtn{
  padding:9px 15px;border-radius:10px;border:1px solid var(--line);
  color:var(--sand);font-weight:500;min-height:44px;white-space:nowrap
}
.hbtn:hover{border-color:var(--gold);color:var(--gold)}
.hbtn.gold{background:var(--gold);color:#141433;border-color:var(--gold);font-weight:600}
.hbtn.gold:hover{background:var(--gold-soft)}

main{flex:1;display:flex;min-height:0}
#rail{
  width:300px;flex-shrink:0;border-right:1px solid var(--line);
  background:var(--panel);display:flex;flex-direction:column;min-height:0
}
#stage{flex:1;overflow-y:auto;min-height:0;padding:22px 26px 90px}
@media(max-width:900px){
  #rail{position:fixed;inset:57px auto 0 0;z-index:40;transform:translateX(-100%);
    transition:transform .22s ease;box-shadow:12px 0 40px rgba(0,0,0,.5)}
  #rail.open{transform:none}
  #stage{padding:18px 16px 90px}
}
@media(min-width:901px){ #menuBtn{display:none} }

/* ---------- rail ---------- */
.rail-head{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:600}
.mala-count{font-family:'Rozha One',serif;font-size:32px;color:var(--gold);line-height:1.1;margin-top:4px}
.mala-count small{font-size:15px;color:var(--mute);font-family:Inter}
.thread{height:6px;background:var(--panel2);border-radius:3px;margin-top:10px;overflow:hidden}
.thread i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));border-radius:3px;transition:width .4s}
#beadList{flex:1;overflow-y:auto;padding:8px}
.bead-row{
  display:flex;gap:12px;align-items:center;width:100%;text-align:left;
  padding:12px 12px;border-radius:12px;color:var(--sand);min-height:56px
}
.bead-row:hover{background:var(--panel2)}
.bead-row.active{background:var(--raised);box-shadow:inset 3px 0 0 var(--gold)}
.bnum{
  width:34px;height:34px;flex-shrink:0;border-radius:50%;
  display:grid;place-items:center;font-family:'Rozha One',serif;font-size:15px;
  background:radial-gradient(circle at 34% 28%,#3a3560,#221f3f 60%,#171530);
  border:1px solid var(--line);color:var(--mute)
}
.bead-row.done .bnum{
  background:radial-gradient(circle at 34% 28%,var(--gold-soft),var(--gold) 55%,#6b5310);
  color:#141433;border-color:var(--gold);box-shadow:0 0 12px rgba(212,175,55,.4)
}
.bmeta{min-width:0}
.btitle{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bsub{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail-foot{padding:10px;border-top:1px solid var(--line)}
.wide{width:100%;padding:12px;border-radius:10px;border:1px dashed var(--line);color:var(--gold);font-weight:600;min-height:48px}
.wide:hover{border-color:var(--gold);background:var(--panel2)}

/* ---------- bead detail ---------- */
.bhead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:4px}
h1{font-family:'Rozha One',serif;font-size:clamp(26px,3.4vw,38px);color:var(--sand);font-weight:400;line-height:1.15}
.tilak{width:52px;height:3px;background:var(--kumkum);border-radius:2px;margin:10px 0 18px}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--panel2);
  border:1px solid var(--line);border-radius:999px;padding:5px 12px;
  font-size:12px;color:var(--gold);font-family:'IBM Plex Mono',monospace
}

/* SIGNATURE: the stage mala */
.mala{
  display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:20px 4px 6px;
  margin:0 -4px 24px;position:relative
}
.stage-node{
  flex:1;min-width:96px;display:flex;flex-direction:column;align-items:center;
  gap:9px;position:relative;background:none;color:var(--mute);padding-bottom:4px
}
.stage-node::before{
  content:"";position:absolute;top:17px;left:-50%;width:100%;height:2px;
  background:var(--line);z-index:0
}
.stage-node:first-child::before{display:none}
.stage-node.reached::before{background:linear-gradient(90deg,var(--gold-dim),var(--gold))}
.sbead{
  width:36px;height:36px;border-radius:50%;z-index:1;
  background:radial-gradient(circle at 34% 28%,#3a3560,#221f3f 60%,#171530);
  border:1.5px solid var(--line);display:grid;place-items:center;
  font-size:14px;transition:all .25s
}
.stage-node.done .sbead{
  background:radial-gradient(circle at 34% 28%,var(--gold-soft),var(--gold) 55%,#6b5310);
  border-color:var(--gold);color:#141433;box-shadow:0 0 14px rgba(212,175,55,.45)
}
.stage-node.current .sbead{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.14)}
.stage-node.locked .sbead{opacity:.4}
.slabel{font-size:11.5px;font-weight:600;text-align:center;line-height:1.25;letter-spacing:.01em}
.stage-node.done .slabel,.stage-node.current .slabel{color:var(--sand)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
.card h2{font-family:'Rozha One',serif;font-size:21px;font-weight:400;color:var(--sand);margin-bottom:3px}
.card .hint{font-size:13px;color:var(--mute);margin-bottom:14px}
label.f{display:block;font-size:12px;color:var(--mute);margin:14px 0 5px;font-weight:600;letter-spacing:.04em}
input[type=text],textarea,select{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:12px 13px;color:var(--sand);min-height:46px
}
textarea{resize:vertical;min-height:130px;line-height:1.6}
textarea.mono{font-family:'IBM Plex Mono',monospace;font-size:13.5px}
input:focus,textarea:focus,select:focus{border-color:var(--gold);outline:none}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}

.btn{padding:12px 18px;border-radius:10px;font-weight:600;min-height:46px}
.btn.gold{background:var(--gold);color:#141433}
.btn.gold:hover{background:var(--gold-soft)}
.btn.ghost{border:1px solid var(--line);color:var(--sand)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn.red{border:1px solid var(--kumkum);color:var(--kumkum)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btnbar{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}

/* checklists */
.check{
  display:flex;gap:13px;align-items:flex-start;padding:13px;border-radius:11px;
  border:1px solid var(--line);margin-bottom:9px;cursor:pointer;background:var(--panel2)
}
.check:hover{border-color:var(--gold-dim)}
.check input{width:22px;height:22px;flex-shrink:0;margin-top:1px;accent-color:var(--gold)}
.check.on{border-color:var(--ok);background:rgba(78,154,106,.08)}
.check .ct{font-size:14px;line-height:1.45}
.gate{
  display:flex;gap:12px;align-items:center;padding:14px;border-radius:11px;
  border:1px solid var(--kumkum);background:rgba(179,38,30,.09);margin-top:14px;font-size:14px
}
.gate.pass{border-color:var(--ok);background:rgba(78,154,106,.1)}

/* prompt blocks */
.blk{border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:9px;background:var(--panel2)}
.blk.on{border-color:var(--gold)}
.blk-top{display:flex;gap:12px;align-items:center}
.blk-top input{width:22px;height:22px;accent-color:var(--gold);flex-shrink:0}
.blk-name{font-weight:600;flex:1}
.blk-tag{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);
  border:1px solid var(--gold-dim);padding:2px 8px;border-radius:999px}
.blk-body{font-size:12.5px;color:var(--mute);margin-top:9px;line-height:1.55;
  font-family:'IBM Plex Mono',monospace;max-height:74px;overflow:hidden}
.blk.on .blk-body{max-height:none;color:var(--sand)}

/* library */
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tab{padding:10px 16px;border-radius:999px;border:1px solid var(--line);color:var(--mute);font-weight:600;min-height:44px}
.tab.on{background:var(--gold);color:#141433;border-color:var(--gold)}
.item{border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:10px;background:var(--panel)}
.item h3{font-size:15px;margin-bottom:5px;color:var(--sand)}
.item p{font-size:13px;color:var(--mute);line-height:1.55;white-space:pre-wrap}

/* misc */
.empty{text-align:center;padding:56px 20px;color:var(--mute)}
.empty .om{font-family:'Rozha One',serif;font-size:44px;color:var(--gold-dim);margin-bottom:12px}
.empty h2{font-family:'Rozha One',serif;font-size:24px;color:var(--sand);font-weight:400;margin-bottom:8px}
#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,90px);
  background:var(--raised);border:1px solid var(--gold);color:var(--gold);
  padding:13px 22px;border-radius:999px;font-weight:600;z-index:90;
  transition:transform .28s;box-shadow:0 10px 34px rgba(0,0,0,.5);max-width:90vw;text-align:center
}
#toast.show{transform:translate(-50%,0)}
#warn{
  background:rgba(179,38,30,.14);border-bottom:1px solid var(--kumkum);
  padding:10px 18px;font-size:13px;color:var(--sand);flex-shrink:0
}
dialog{
  border:1px solid var(--line);background:var(--panel);color:var(--sand);
  border-radius:16px;padding:24px;max-width:520px;width:92vw
}
dialog::backdrop{background:rgba(6,6,20,.75)}
dialog h2{font-family:'Rozha One',serif;font-size:23px;font-weight:400;margin-bottom:14px}
.ylist{max-height:46vh;overflow-y:auto;margin:6px 0 14px}
.yrow{display:flex;gap:12px;align-items:center;width:100%;padding:13px;border-radius:11px;
  border:1px solid var(--line);margin-bottom:8px;text-align:left;color:var(--sand);min-height:56px}
.yrow:hover{border-color:var(--gold)}
.yrow.on{border-color:var(--gold);background:var(--panel2)}
</style>
</head>
<body>
<div id="app">
  <div id="warn" hidden></div>
  <header>
    <button class="hbtn" id="menuBtn" aria-label="Beads">☰</button>
    <div class="brand">ॐ विश्वरूप <span>स्टूडियो</span></div>
    <button class="yatra-pick" id="yatraBtn">यात्रा चुनिए</button>
    <div class="spacer"></div>
    <button class="hbtn" id="libBtn">स्मृति · Memory</button>
    <button class="hbtn" id="dataBtn">Backup</button>
  </header>

  <main>
    <aside id="rail">
      <div class="rail-head">
        <div class="eyebrow">मणि पूर्ण</div>
        <div class="mala-count" id="malaCount">0<small> / 108</small></div>
        <div class="thread"><i id="threadFill" style="width:0%"></i></div>
      </div>
      <div id="beadList"></div>
      <div class="rail-foot"><button class="wide" id="newBeadBtn">+ नई मणि</button></div>
    </aside>
    <section id="stage"></section>
  </main>
</div>

<div id="toast"></div>

<dialog id="yatraDlg">
  <h2>यात्रा</h2>
  <div class="ylist" id="ylist"></div>
  <label class="f">नई यात्रा का नाम</label>
  <input type="text" id="newYatraName" placeholder="जैसे — विश्वरूप 108">
  <div class="btnbar">
    <button class="btn gold" id="createYatra">यात्रा बनाइए</button>
    <button class="btn ghost" onclick="yatraDlg.close()">बंद</button>
  </div>
</dialog>

<script>
/* ============================ storage ============================ */
const Store = (() => {
  let mem = {}, ok = true;
  try { localStorage.setItem('__vs', '1'); localStorage.removeItem('__vs'); }
  catch (e) { ok = false; }
  return {
    ok,
    get(k) { try { return ok ? localStorage.getItem(k) : mem[k] } catch (e) { return mem[k] } },
    set(k, v) { try { ok ? localStorage.setItem(k, v) : (mem[k] = v) } catch (e) { mem[k] = v } }
  };
})();

const STAGES = [
  { id:'research',   label:'शोध\nResearch' },
  { id:'script',     label:'पटकथा\nScript' },
  { id:'storyboard', label:'दृश्यक्रम\nStoryboard' },
  { id:'prompts',    label:'प्रॉम्प्ट\nPrompt Pack' },
  { id:'assets',     label:'सामग्री\nAssets' },
  { id:'timeline',   label:'संपादन\nTimeline' },
  { id:'qa',         label:'परीक्षा\nQA Gate' },
  { id:'publish',    label:'प्रकाशन\nPublish' }
];

/* ============================ seed ============================ */
function seed() {
  const yid = 'y_vishwaroop108';
  return {
    v: 1,
    activeYatra: yid,
    activeBead: 'b_1',
    yatras: [{ id: yid, name: 'विश्वरूप 108', target: 108, created: Date.now() }],
    beads: [
      { id:'b_1', yatraId:yid, num:1, title:'प्रथम पूज्य — विश्व के गणेश', deity:'गणेश',
        place:'Indonesia · Japan · Bharat', stages:{}, notes:{
        research:`VERIFIED FACTS

INDONESIA
• 20,000-rupiah note (1998–2008) carried Lord Ganesha.
• Shown beside Ki Hajar Dewantara, Indonesia's education pioneer.
• Reverse shows a classroom with children studying.
• Reason: Ganesha honoured as the god of knowledge/education.
• Retired Dec 2008 — routine currency replacement, no controversy.
• National emblem is Garuda (Vishnu's vahana).
• Bandung Institute of Technology (ITB) logo features Ganesha.

JAPAN
• Worshipped as Kangiten (歓喜天).
• Hozan-ji, Mount Ikoma near Osaka; Matsuchiyama Shoden, Tokyo (7th–8th c.).
• Idol is a hibutsu — hidden deity in a CLOSED WOODEN BOX. Devotees bow to the box.
• Offering: kangidan — a sweet resembling the modak. Also daikon radish.
• ~1,000 Kangiten temples in the Edo period; 250+ associated today.
• Japan's FIRST CABLE CAR (1918) was built to reach Hozan-ji.

BHARAT — the "why"
• Shiva Purana parikrama contest. Kartikeya circles the universe;
  Ganesha circles his parents: "मेरे लिए मेरे माता-पिता ही संसार हैं।"`,
        script:'', storyboard:'', prompts:'', assets:'', timeline:'', qa:'', publish:'' } },

      { id:'b_2', yatraId:yid, num:2, title:'कनिपकम — बढ़ती हुई प्रतिमा', deity:'गणेश',
        place:'Chittoor, Andhra Pradesh', stages:{}, notes:{
        research:`VERIFIED FACTS

• Swayambhu Vinayaka believed to be GROWING. Temple displays TWO KAVACHAMS
  of different sizes — one from 1947, one from 2008. The older no longer fits.
• Discovery: three brothers (mute, deaf, blind) digging a well struck stone;
  water turned red; all three were instantly cured.
• The idol's BASE WAS NEVER FOUND, however deep they dug.
• Water oozes around the murti perennially; overflows even in peak summer;
  given to devotees as theertham.
• PRAMANAM: disputes settled by a dip in the tank + oath before the Lord.
  Recorded instances of the guilty confessing BEFORE entering the temple.
  Tradition respected even during the British era.
• Built early 11th c. by Kulothunga Chola I; expanded 1336 by Vijayanagara.
• "Kani" = wetland, "Pakam" = flow of water.
• Bahuda river: Sankha & Likhita — severed hands restored after a dip.
• 11 km from Chittoor; ~68 km from Tirupati; many visit BEFORE Tirupati.
• Brahmotsavam: 21 days from Ganesh Chaturthi.

MARYADA FOR THIS BEAD
• "Growing" = belief with displayed evidence ("भक्त मानते हैं") — never asserted geology.
• Red water rendered as DIVINE LIGHT, never gore.
• Pramanam = living tradition, not legal advice. No identifiable people.`,
        script:'', storyboard:'', prompts:'', assets:'', timeline:'', qa:'', publish:'' } },

      { id:'b_3', yatraId:yid, num:3, title:'त्रिनेत्र गणेश — जिन्हें चिट्ठियाँ आती हैं', deity:'गणेश',
        place:'Ranthambore, Rajasthan', stages:{}, notes:{
        research:`TO RESEARCH (open loop — must be produced BEFORE Bead 2 publishes)

• The letters-to-God tradition: how the post actually reaches the temple.
• Wedding invitations addressed to Bhagwan; the first-invitation custom.
• Ranthambore fort history and the temple's placement within it.
• The Trinetra (three-eyed) form — iconography and its meaning.
• Family darshan: Riddhi, Siddhi, Shubh, Labh.

TEASE ALREADY SCRIPTED IN BEAD 2:
"वो भगवान जिन्हें चिट्ठियाँ आती हैं।"`,
        script:'', storyboard:'', prompts:'', assets:'', timeline:'', qa:'', publish:'' } }
    ],
    blocks: [
      { id:'blk_style', name:'Global Style — Documentary', tag:'style',
        text:'Cinematic documentary realism, anamorphic lens feel, volumetric golden-hour light against deep indigo shadows, photoreal textures, subtle film grain, no text, no watermark, reverent tone, no faces of real people.' },
      { id:'blk_icon_ganesh', name:'Iconography Lock — Ganesha', tag:'maryada',
        text:'Lord Ganesha strictly per traditional Hindu iconography: elephant head with one broken tusk (ekadanta), four arms holding ankusha, pasha, modak, and abhaya mudra, red-orange silk dhoti, golden ornaments, sacred thread, mouse (mushak) companion small at his feet, serene benevolent expression, divine golden aura. Never comic, never in modern clothing or vehicles, never eating or dancing frivolously. Depict as murti/relief/painterly form — not as a character actor.' },
      { id:'blk_katha', name:'Painterly Katha Style', tag:'style',
        text:'Painterly devotional animation style, Pahari-miniature meets modern matte painting, warm sacred palette, gentle 2.5D parallax, luminous divine light, compassionate framing.' },
      { id:'blk_trikaal', name:'Trikaal Darshan — Resurrection', tag:'signature',
        text:'Time-lapse divine construction: the ruined structure assembling itself stone by stone from mist, carvings etching themselves into rock in trails of golden light, deep teal and gold time-shift palette, epic orbiting camera, particles throughout, awe-inspiring.' },
      { id:'blk_vertical', name:'Vertical Modifier — 9:16', tag:'format',
        text:'Vertical 9:16 composition, subject in upper two-thirds, clear lower third for the counter and captions, generous headroom for the top text strip.' },
      { id:'blk_loop', name:'Loopable Ambient Modifier', tag:'format',
        text:'Seamless loop: first and last frame identical. Continuous gentle motion only, no camera shake, no sudden movement, ultra slow motion.' }
    ],
    qaRules: [
      'देवता केवल पारंपरिक iconography में — कोई meme, वाहन, trend format नहीं।',
      'कोई भी मंत्र/श्लोक अधूरा नहीं। विराम केवल पूर्ण पंक्ति के बीच।',
      'कथा को कथा कहा गया है ("कथा है…", "भक्त मानते हैं…"); तथ्य तिथि सहित।',
      'गुप्त मूर्तियाँ पर्दे पर गुप्त ही रहें (जैसे कांगितेन का बंद बक्सा)।',
      'कोई alien / lost-technology दावा नहीं। रहस्य = महिमा।',
      'अन्य पंथों का उल्लेख सम्मान के साथ।',
      'AI disclosure ON — YouTube altered/synthetic toggle व description line।',
      'कोई चिकित्सकीय या वैज्ञानिक दावा नहीं ("परंपरा कहती है", न कि "सिद्ध है")।',

/* ============================ state ============================ */
let DB = load();
function load() {
  const raw = Store.get('vishwaroop_studio');
  if (!raw) return seed();
  try {
    const d = JSON.parse(raw);
    const s = seed();
    // forward-compatible merge
    return { ...s, ...d, blocks: d.blocks || s.blocks, qaRules: d.qaRules || s.qaRules, ragas: d.ragas || s.ragas };
  } catch (e) { return seed(); }
}
function save() { Store.set('vishwaroop_studio', JSON.stringify(DB)); }
const $ = id => document.getElementById(id);
const esc = s => (s || '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2300); }

const yatra = () => DB.yatras.find(y => y.id === DB.activeYatra);
const beadsOf = () => DB.beads.filter(b => b.yatraId === DB.activeYatra).sort((a, b) => a.num - b.num);
const bead = () => DB.beads.find(b => b.id === DB.activeBead);
const isDone = b => STAGES.every(s => b.stages[s.id]);

/* ============================ rail ============================ */
function renderRail() {
  const y = yatra();
  $('yatraBtn').textContent = y ? y.name : 'यात्रा चुनिए';
  const list = beadsOf(), done = list.filter(isDone).length, target = (y && y.target) || 108;
  $('malaCount').innerHTML = `${done}<small> / ${target}</small>`;
  $('threadFill').style.width = Math.min(100, (done / target) * 100) + '%';

  $('beadList').innerHTML = list.length ? list.map(b => `
    <button class="bead-row ${b.id === DB.activeBead ? 'active' : ''} ${isDone(b) ? 'done' : ''}" data-b="${b.id}">
      <span class="bnum">${b.num}</span>
      <span class="bmeta">
        <span class="btitle">${esc(b.title)}</span>
        <span class="bsub">${esc(b.place || b.deity || '—')} · ${STAGES.filter(s => b.stages[s.id]).length}/8</span>
      </span>
    </button>`).join('')
    : `<div class="empty" style="padding:34px 16px"><div class="om">॥</div>
       <p style="font-size:13px">अभी कोई मणि नहीं।<br>नीचे से पहली मणि जोड़िए।</p></div>`;

  $('beadList').querySelectorAll('.bead-row').forEach(el =>
    el.onclick = () => { DB.activeBead = el.dataset.b; save(); render(); $('rail').classList.remove('open'); });
}

/* ============================ stage view ============================ */
let VIEW = 'bead', LIBTAB = 'blocks', CURSTAGE = null;

function render() {
  renderRail();
  if (VIEW === 'library') return renderLibrary();
  renderBead();
}

function renderBead() {
  const b = bead();
  if (!b || b.yatraId !== DB.activeYatra) {
    const first = beadsOf()[0];
    if (first) { DB.activeBead = first.id; return renderBead(); }
    $('stage').innerHTML = `<div class="empty">
      <div class="om">ॐ</div><h2>यात्रा आरंभ कीजिए</h2>
      <p>पहली मणि जोड़िए — हर मणि एक episode है।</p>
      <div class="btnbar" style="justify-content:center"><button class="btn gold" onclick="newBead()">पहली मणि बनाइए</button></div>
    </div>`;
    return;
  }
  const doneCount = STAGES.filter(s => b.stages[s.id]).length;
  const curIdx = CURSTAGE !== null ? CURSTAGE : Math.min(doneCount, STAGES.length - 1);
  const st = STAGES[curIdx];

  $('stage').innerHTML = `
    <div class="bhead">
      <div style="flex:1;min-width:240px">
        <h1>${esc(b.title)}</h1>
        <div style="margin-top:9px;display:flex;gap:8px;flex-wrap:wrap">
          <span class="chip">Bead ${b.num} / ${(yatra() || {}).target || 108}</span>
          ${b.deity ? `<span class="chip">${esc(b.deity)}</span>` : ''}
          ${b.place ? `<span class="chip">${esc(b.place)}</span>` : ''}
          <span class="chip">${doneCount}/8 चरण</span>
        </div>
      </div>
      <button class="btn ghost" onclick="editBead()">संपादित</button>
    </div>
    <div class="tilak"></div>

    <div class="mala" role="tablist">
      ${STAGES.map((s, i) => {
        const done = !!b.stages[s.id];
        const reached = i <= doneCount;
        const locked = s.id === 'publish' && !gatePassed(b);
        const [hi, en] = s.label.split('\n');
        return `<button class="stage-node ${done ? 'done' : ''} ${i === curIdx ? 'current' : ''} ${reached ? 'reached' : ''} ${locked ? 'locked' : ''}"
          data-i="${i}" role="tab" aria-selected="${i === curIdx}">
          <span class="sbead">${done ? '✓' : (locked ? '🔒' : i + 1)}</span>
          <span class="slabel">${hi}<br>${en}</span>
        </button>`;
      }).join('')}
    </div>

    <div id="work"></div>`;

  document.querySelectorAll('.stage-node').forEach(el =>
    el.onclick = () => { CURSTAGE = +el.dataset.i; renderBead(); });

  renderWork(b, st, curIdx);
}

function gatePassed(b) {
  const checked = b.stages.qaChecks || [];
  return DB.qaRules.every((_, i) => checked.includes(i));
}

function renderWork(b, st, idx) {
  const w = $('work');
  const done = !!b.stages[st.id];
  const [hi, en] = st.label.split('\n');

  const help = {
    research:  'तथ्य इकट्ठा कीजिए — तिथि, स्रोत, और maryada नोट्स। कथा को कथा लिखिए।',
    script:    'Rahasya → Aankhon Dekhi → Trikaal → Sthala Purana → Amrit Vachan → Agla Padav.',
    storyboard:'हर beat के लिए एक shot। कौन-सा shot signature है, वहाँ ⭐ लगाइए।',
    prompts:   'नीचे से blocks चुनिए, अपना shot लिखिए, और पूरा prompt copy कीजिए।',
    assets:    'क्या generate हुआ, कहाँ रखा है, क्या दोबारा बनाना है।',
    timeline:  'VN में assembly — audio, counter overlay (Blend → Screen), outro।',
    qa:        'मर्यादा की जाँच। सब सही होने तक Publish बंद रहेगा।',
    publish:   'Title, description, hashtags, pinned comment, tracker update।'
  }[st.id];

  if (st.id === 'prompts') return renderPrompts(b, st, help);
  if (st.id === 'qa')      return renderQA(b, st, help);

  w.innerHTML = `
    <div class="card">
      <h2>${hi} · ${en}</h2>
      <p class="hint">${help}</p>
      <textarea id="noteBox" class="${st.id === 'prompts' ? 'mono' : ''}" placeholder="यहाँ लिखिए…">${esc(b.notes[st.id] || '')}</textarea>
      <div class="btnbar">
        <button class="btn gold" id="saveNote">सहेजिए</button>
        <button class="btn ghost" id="toggleStage">${done ? '↩︎ चरण खोलिए' : '✓ चरण पूर्ण'}</button>
        ${st.id === 'publish' && !gatePassed(b) ? '<span style="align-self:center;color:var(--kumkum);font-size:13px">QA अधूरा — Publish बंद है</span>' : ''}
      </div>
    </div>`;

  $('saveNote').onclick = () => { b.notes[st.id] = $('noteBox').value; save(); toast('सहेजा गया'); };
  $('toggleStage').onclick = () => {
    if (st.id === 'publish' && !gatePassed(b) && !b.stages.publish) return toast('पहले QA पूरा कीजिए');
    b.notes[st.id] = $('noteBox').value;
    b.stages[st.id] = !b.stages[st.id];
    save(); toast(b.stages[st.id] ? 'चरण पूर्ण 🙏' : 'चरण खोला गया'); renderBead();
  };
}

/* ---------- prompt pack ---------- */
function renderPrompts(b, st, help) {
  const sel = b.stages.blockSel || [];
  $('work').innerHTML = `
    <div class="card">
      <h2>प्रॉम्प्ट · Prompt Pack</h2>
      <p class="hint">${help}</p>
      <label class="f">Shot / दृश्य का वर्णन</label>
      <textarea id="shotBox" class="mono" style="min-height:100px" placeholder="जैसे — Extreme macro of an ornate banknote rotating slowly in black void, raking golden light…">${esc(b.stages.shotText || '')}</textarea>
      <label class="f">Blocks — जो लगाने हैं</label>
      ${DB.blocks.map(bl => `
        <label class="blk ${sel.includes(bl.id) ? 'on' : ''}" data-id="${bl.id}">
          <div class="blk-top">
            <input type="checkbox" ${sel.includes(bl.id) ? 'checked' : ''} data-c="${bl.id}">
            <span class="blk-name">${esc(bl.name)}</span>
            <span class="blk-tag">${esc(bl.tag)}</span>
          </div>
          <div class="blk-body">${esc(bl.text)}</div>
        </label>`).join('')}
      <label class="f">पूरा prompt</label>
      <textarea id="outBox" class="mono" readonly style="min-height:150px"></textarea>
      <div class="btnbar">
        <button class="btn gold" id="copyPrompt">Copy prompt</button>
        <button class="btn ghost" id="savePrompt">Pack में जोड़िए</button>
        <button class="btn ghost" id="toggleStage2">${b.stages.prompts ? '↩︎ चरण खोलिए' : '✓ चरण पूर्ण'}</button>
      </div>
    </div>
    <div class="card">
      <h2>इस मणि का Prompt Pack</h2>
      <p class="hint">जोड़े गए prompts — सीधे Flow / Veo / Grok में ले जाइए।</p>
      <textarea id="packBox" class="mono" style="min-height:170px" placeholder="अभी खाली है।">${esc(b.notes.prompts || '')}</textarea>
      <div class="btnbar"><button class="btn ghost" id="savePack">Pack सहेजिए</button></div>
    </div>`;

  const build = () => {
    const chosen = DB.blocks.filter(x => (b.stages.blockSel || []).includes(x.id));
    const shot = ($('shotBox').value || '').trim();
    $('outBox').value = [...chosen.map(c => c.text), shot].filter(Boolean).join('\n\n');
  };
  document.querySelectorAll('[data-c]').forEach(cb => cb.onchange = () => {
    const id = cb.dataset.c, s = new Set(b.stages.blockSel || []);
    cb.checked ? s.add(id) : s.delete(id);
    b.stages.blockSel = [...s]; save(); renderPrompts(b, st, help);
  });
  $('shotBox').oninput = () => { b.stages.shotText = $('shotBox').value; build(); };
  build();

  $('copyPrompt').onclick = async () => {
    const t = $('outBox').value;
    if (!t.trim()) return toast('पहले shot लिखिए');
    try { await navigator.clipboard.writeText(t); toast('Copy हो गया'); }
    catch (e) { $('outBox').select(); document.execCommand('copy'); toast('Copy हो गया'); }
  };
  $('savePrompt').onclick = () => {
    const t = $('outBox').value.trim(); if (!t) return toast('पहले shot लिखिए');
    b.notes.prompts = (b.notes.prompts ? b.notes.prompts + '\n\n— — —\n\n' : '') + t;
    save(); renderPrompts(b, st, help); toast('Pack में जुड़ा');
  };
  $('savePack').onclick = () => { b.notes.prompts = $('packBox').value; save(); toast('सहेजा गया'); };
  $('toggleStage2').onclick = () => { b.stages.prompts = !b.stages.prompts; save(); renderBead(); };
}

/* ---------- QA gate ---------- */
function renderQA(b, st, help) {
  const checked = b.stages.qaChecks || [];
  const pass = gatePassed(b);
  $('work').innerHTML = `
    <div class="card">
      <h2>परीक्षा · QA Gate</h2>
      <p class="hint">${help}</p>
      ${DB.qaRules.map((r, i) => `
        <label class="check ${checked.includes(i) ? 'on' : ''}">
          <input type="checkbox" data-q="${i}" ${checked.includes(i) ? 'checked' : ''}>
          <span class="ct">${esc(r)}</span>
        </label>`).join('')}
      <div class="gate ${pass ? 'pass' : ''}">
        <span style="font-size:20px">${pass ? '🙏' : '⛔'}</span>
        <span>${pass ? 'सब जाँच पूर्ण — Publish खुल गया।' : `${DB.qaRules.length - checked.length} जाँच बाक़ी — Publish बंद है।`}</span>
      </div>
      <label class="f">QA नोट्स</label>
      <textarea id="noteBox" placeholder="किसने जाँचा, क्या बदला…">${esc(b.notes.qa || '')}</textarea>
      <div class="btnbar">
        <button class="btn gold" id="saveNote">सहेजिए</button>
        <button class="btn ghost" id="toggleStage3" ${pass ? '' : 'disabled'}>${b.stages.qa ? '↩︎ चरण खोलिए' : '✓ चरण पूर्ण'}</button>
      </div>
    </div>`;

  document.querySelectorAll('[data-q]').forEach(cb => cb.onchange = () => {
    const i = +cb.dataset.q, s = new Set(b.stages.qaChecks || []);
    cb.checked ? s.add(i) : s.delete(i);
    b.stages.qaChecks = [...s]; save(); renderQA(b, st, help);
  });
  $('saveNote').onclick = () => { b.notes.qa = $('noteBox').value; save(); toast('सहेजा गया'); };
  $('toggleStage3').onclick = () => { b.notes.qa = $('noteBox').value; b.stages.qa = !b.stages.qa; save(); renderBead(); };
}

/* ============================ library ============================ */
function renderLibrary() {
  $('stage').innerHTML = `
    <h1>स्मृति · Memory</h1>
    <div class="tilak"></div>
    <p style="color:var(--mute);margin-bottom:18px;max-width:60ch">पुन:प्रयोग होने वाली चीज़ें — हर मणि इन्हीं से बनती है। यहाँ बदला, तो हर जगह बदल जाएगा।</p>
    <div class="tabs">
      ${[['blocks','Prompt Blocks'],['qa','मर्यादा · QA Rules'],['raga','राग नक्शा']].map(([k, l]) =>
        `<button class="tab ${LIBTAB === k ? 'on' : ''}" data-t="${k}">${l}</button>`).join('')}
    </div>
    <div id="libBody"></div>`;
  document.querySelectorAll('[data-t]').forEach(el => el.onclick = () => { LIBTAB = el.dataset.t; renderLibrary(); });

  const body = $('libBody');
  if (LIBTAB === 'blocks') {
    body.innerHTML = DB.blocks.map(b => `
      <div class="item"><h3>${esc(b.name)} <span class="blk-tag">${esc(b.tag)}</span></h3><p>${esc(b.text)}</p>
      <div class="btnbar"><button class="btn ghost" data-del="${b.id}">हटाइए</button></div></div>`).join('') +
      `<div class="card"><h2>नया block</h2>
        <label class="f">नाम</label><input type="text" id="nbName" placeholder="जैसे — Iconography Lock: Shiva">
        <label class="f">Tag</label><input type="text" id="nbTag" placeholder="style / maryada / signature / format">
        <label class="f">Text</label><textarea id="nbText" class="mono" placeholder="वह पाठ जो prompt में जुड़ेगा…"></textarea>
        <div class="btnbar"><button class="btn gold" id="addBlk">Block जोड़िए</button></div></div>`;
    body.querySelectorAll('[data-del]').forEach(el => el.onclick = () => {
      DB.blocks = DB.blocks.filter(x => x.id !== el.dataset.del); save(); renderLibrary(); toast('हटाया गया');
    });
    $('addBlk').onclick = () => {
      const n = $('nbName').value.trim(), t = $('nbText').value.trim();
      if (!n || !t) return toast('नाम और text ज़रूरी हैं');
      DB.blocks.push({ id: 'blk_' + Date.now(), name: n, tag: $('nbTag').value.trim() || 'style', text: t });
      save(); renderLibrary(); toast('Block जुड़ा');
    };
  } else if (LIBTAB === 'qa') {
    body.innerHTML = DB.qaRules.map((r, i) => `
      <div class="item"><p style="color:var(--sand)">${i + 1}. ${esc(r)}</p>
      <div class="btnbar"><button class="btn ghost" data-dq="${i}">हटाइए</button></div></div>`).join('') +
      `<div class="card"><h2>नया नियम</h2>
        <textarea id="nqText" placeholder="वह नियम जो हर मणि पर जाँचा जाएगा…" style="min-height:90px"></textarea>
        <div class="btnbar"><button class="btn gold" id="addQ">नियम जोड़िए</button></div></div>`;
    body.querySelectorAll('[data-dq]').forEach(el => el.onclick = () => {
      DB.qaRules.splice(+el.dataset.dq, 1); save(); renderLibrary(); toast('हटाया गया');
    });
    $('addQ').onclick = () => {
      const t = $('nqText').value.trim(); if (!t) return toast('नियम लिखिए');
      DB.qaRules.push(t); save(); renderLibrary(); toast('नियम जुड़ा');
    };
  } else {
    body.innerHTML = `<p style="color:var(--mute);margin-bottom:14px;font-size:13.5px">
      AI tools राग का नाम नहीं समझते — दाईं ओर का prompt वाक्य उनके लिए है।</p>` +
      DB.ragas.map(r => `<div class="item"><h3>${esc(r.c)} → <span style="color:var(--gold)">${esc(r.r)}</span></h3>
        <p style="font-family:'IBM Plex Mono',monospace;font-size:12.5px">${esc(r.p)}</p></div>`).join('');
  }
}

/* ============================ actions ============================ */
function newBead() {
  const list = beadsOf();
  const num = list.length ? Math.max(...list.map(b => b.num)) + 1 : 1;
  const title = prompt('मणि का शीर्षक:', `मणि ${num}`);
  if (!title) return;
  const b = { id: 'b_' + Date.now(), yatraId: DB.activeYatra, num, title, deity: '', place: '',
    stages: {}, notes: { research:'', script:'', storyboard:'', prompts:'', assets:'', timeline:'', qa:'', publish:'' } };
  DB.beads.push(b); DB.activeBead = b.id; CURSTAGE = null; VIEW = 'bead'; save(); render(); toast('मणि जुड़ी');
}
function editBead() {
  const b = bead(); if (!b) return;
  const t = prompt('शीर्षक:', b.title); if (t === null) return;
  const d = prompt('देवता:', b.deity || ''); if (d === null) return;
  const p = prompt('स्थान:', b.place || ''); if (p === null) return;
  b.title = t || b.title; b.deity = d; b.place = p; save(); render(); toast('अद्यतन');
}

$('newBeadBtn').onclick = newBead;
$('menuBtn').onclick = () => $('rail').classList.toggle('open');
$('libBtn').onclick = () => { VIEW = VIEW === 'library' ? 'bead' : 'library'; render(); };
$('yatraBtn').onclick = () => { renderYatraDlg(); $('yatraDlg').showModal(); };

      <span class="bnum" style="width:30px;height:30px;font-size:13px">${n}</span>
      <span><b>${esc(y.name)}</b><br><span style="font-size:12px;color:var(--mute)">${n} मणि · लक्ष्य ${y.target}</span></span>
    </button>`;
  }).join('');
  $('ylist').querySelectorAll('[data-y]').forEach(el => el.onclick = () => {
    DB.activeYatra = el.dataset.y;
    const f = beadsOf()[0]; DB.activeBead = f ? f.id : null;
    CURSTAGE = null; VIEW = 'bead'; save(); render(); $('yatraDlg').close();
  });
}
$('createYatra').onclick = () => {
  const n = $('newYatraName').value.trim(); if (!n) return toast('नाम लिखिए');

  a.href = URL.createObjectURL(blob);
  a.download = 'vishwaroop_studio_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click(); toast('Backup download हुआ');
};
window.addEventListener('keydown', e => {
  if (e.key === 'i' && e.ctrlKey) {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json';
    inp.onchange = async () => {
      try { DB = JSON.parse(await inp.files[0].text()); save(); render(); toast('Backup लौटा'); }
      catch (err) { toast('फ़ाइल पढ़ी नहीं गई'); }
    };
    inp.click();
  }
});

/* ============================ boot ============================ */
if (!Store.ok) {
  const w = $('warn'); w.hidden = false;
  w.innerHTML = '⚠️ यह preview है — यहाँ काम सहेजा नहीं जाएगा। Tablet पर install करने के बाद सब सुरक्षित रहेगा।';
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
save(); render();
</script>
</body>
</html>
